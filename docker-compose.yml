services:
  db:
    image: postgres:16-alpine
    container_name: sgams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sgams}
      POSTGRES_USER: ${DB_USER:-sgams_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sgams_password}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-sgams_user} -d ${DB_NAME:-sgams}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sgams-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sgams}
      DB_USER: ${DB_USER:-sgams_user}
      DB_PASSWORD: ${DB_PASSWORD:-sgams_password}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret_before_deployment}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ADMIN_REGISTRATION_KEY: ${ADMIN_REGISTRATION_KEY:-joineazy-admin}
    ports:
      - '${PORT:-5000}:5000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sgams-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-5173}:80'
    depends_on:
      - backend

volumes:
  postgres_data:
